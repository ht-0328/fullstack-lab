# ローカル環境の入口。AWS 環境の ALB（ホスト/パスによる振り分け + 認証アクション）の役割を代行する。
#   localhost        → 一般利用者（マイページ）。認証は Keycloak（realm: customer）
#   admin.localhost  → 社員（管理画面）。認証は Okta の代替の Keycloak（realm: staff）
# どちらも同じ Nuxt / BFF に流し、利用者の種別は BFF が JWT の発行元から判断する。

# Docker の内部 DNS。upstream 名をリクエスト時に解決するため、
# 転送先のコンテナが作り直されても Nginx を再起動せずに済む。
resolver 127.0.0.11 valid=10s ipv6=off;

# return 302 /path を相対のまま返す（既定ではコンテナ内のポート 80 を含む絶対 URL になり、
# ホスト側の 8080 番と食い違うため）
absolute_redirect off;

# 認証後のレスポンスヘッダー（Set-Cookie）が大きくなるため、バッファを広げる
proxy_buffer_size 16k;
proxy_buffers 8 16k;
large_client_header_buffers 4 16k;

server {
    listen 80 default_server;
    server_name localhost;

    set $oauth2_upstream http://oauth2-proxy-customer:4180;
    include /etc/nginx/snippets/app-locations.conf;
    # 会員登録の画面と API、静的アセットは認証なしで通す（一般利用者のホストだけ）
    include /etc/nginx/snippets/public-locations.conf;
}

server {
    listen 80;
    server_name admin.localhost;

    set $oauth2_upstream http://oauth2-proxy-staff:4180;
    include /etc/nginx/snippets/app-locations.conf;
}
