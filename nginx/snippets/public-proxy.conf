# 未認証のリクエストを後段へ転送するときの共通設定（公開パス用）。
# authenticated-proxy.conf との違いは、認証情報を渡さないこと。
# クライアントが X-Amzn-Oidc-* を付けてきても、空に上書きして捨てる（ALB も認証なしのルールではこれらを付けない）。

add_header X-Request-Id $request_id always;

proxy_http_version 1.1;
proxy_set_header Host                    $host;
proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto       $scheme;
proxy_set_header X-Request-Id            $request_id;
proxy_set_header X-Amzn-Oidc-Identity    "";
proxy_set_header X-Amzn-Oidc-Accesstoken "";
proxy_set_header X-Amzn-Oidc-Data        "";
