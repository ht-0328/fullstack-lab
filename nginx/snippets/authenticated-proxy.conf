# 認証済みリクエストを後段へ転送するときの共通設定。
# ALB が付与するヘッダーと同じ名前で、oauth2-proxy から受け取った認証情報を渡す。
#   x-amzn-oidc-identity    : ユーザーの sub
#   x-amzn-oidc-accesstoken : IdP が発行したアクセストークン（JWT）。BFF が署名を検証する
#   x-amzn-oidc-data        : ALB が署名する JWT。ローカルでは再現しないため空にする（=送られない）
# クライアントが同名ヘッダーを送ってきても、proxy_set_header で必ず上書きされる。

auth_request_set $auth_user   $upstream_http_x_auth_request_user;
auth_request_set $auth_token  $upstream_http_x_auth_request_access_token;
# トークン更新時に oauth2-proxy が発行し直す Cookie をブラウザへ返す
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $auth_cookie;
add_header X-Request-Id $request_id always;

proxy_http_version 1.1;
proxy_set_header Host                    $host;
proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto       $scheme;
proxy_set_header X-Request-Id            $request_id;
proxy_set_header X-Amzn-Oidc-Identity    $auth_user;
proxy_set_header X-Amzn-Oidc-Accesstoken $auth_token;
proxy_set_header X-Amzn-Oidc-Data        "";
