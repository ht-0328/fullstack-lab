# 各 server ブロックで共通のルーティング。$oauth2_upstream は include 元で設定する。

set $nuxt_upstream    http://nuxt:3000;
set $bff_upstream     http://bff:8080;
set $swagger_upstream http://swagger-ui:8080;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# --- 認証（ALB の認証アクションの代替） -------------------------------------------
# /oauth2/start（ログイン開始）、/oauth2/callback（IdP からの戻り）、/oauth2/sign_out（ログアウト）
location /oauth2/ {
    proxy_pass $oauth2_upstream;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
}

# auth_request から呼ばれる。セッション Cookie が有効なら 202、無効なら 401 が返る
location = /oauth2/auth {
    internal;
    proxy_pass $oauth2_upstream;
    proxy_pass_request_body off;
    proxy_set_header Content-Length    "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI    $request_uri;
}

# --- アプリ ---------------------------------------------------------------------
# ブラウザからの BFF 呼び出し。未認証なら（ALB の on-unauthenticated-request: deny と同様に）
# ログイン画面へのリダイレクトではなく 401 を返し、画面側でログインへ誘導させる
location /bff/ {
    auth_request /oauth2/auth;
    error_page 401 = @unauthorized_json;
    include /etc/nginx/snippets/authenticated-proxy.conf;
    proxy_pass $bff_upstream;
}

# OpenAPI 仕様の閲覧（Swagger UI）。BFF の仕様は同一オリジンなので、ログイン済みなら Try it out が動く
location /swagger/ {
    auth_request /oauth2/auth;
    error_page 401 = @login;
    include /etc/nginx/snippets/authenticated-proxy.conf;
    proxy_pass $swagger_upstream;
}

# API は内部サービスであり、入口からは公開しない
location /api/ {
    return 404;
}

# 画面（SSR の HTML、/_nuxt/ の静的アセット）。未認証ならログインへリダイレクト
location / {
    auth_request /oauth2/auth;
    error_page 401 = @login;
    include /etc/nginx/snippets/authenticated-proxy.conf;
    proxy_pass $nuxt_upstream;
}

location @login {
    return 302 /oauth2/start?rd=$request_uri;
}

location @unauthorized_json {
    default_type application/problem+json;
    return 401 '{"status":401,"title":"Unauthorized","detail":"login required"}';
}
