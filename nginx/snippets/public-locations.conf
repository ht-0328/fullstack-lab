# 認証なしで転送する公開パス。一般利用者のホスト（localhost）の server ブロックだけが include する。
# AWS では、ALB のリスナールールにパス条件を付け、認証アクション（authenticate-oidc）を付けないことに相当する。
#   /signup      : 会員登録の画面（Nuxt の SSR）
#   /bff/signup  : 会員登録の API（BFF で唯一、JWT を要求しないエンドポイント）
#   /_nuxt/      : 画面の静的アセット（公開ページの描画に必要）
# ここを通るリクエストは認証していないので、後段へ渡す認証ヘッダーは必ず空にする（public-proxy.conf）。
# 社員のホストには公開パスを作らない（app-locations.conf の location / が auth_request で守る）。

location = /signup {
    include /etc/nginx/snippets/public-proxy.conf;
    proxy_pass $nuxt_upstream;
}

location = /bff/signup {
    include /etc/nginx/snippets/public-proxy.conf;
    proxy_pass $bff_upstream;
}

location /_nuxt/ {
    include /etc/nginx/snippets/public-proxy.conf;
    proxy_pass $nuxt_upstream;
}
